name: Build iOS (Capacitor)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Xcode App
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install NPM dependencies
        working-directory: ./app
        run: npm ci

      - name: Build Web Application & Sync iOS
        working-directory: ./app
        run: |
          npm run build
          npx cap sync ios

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build iOS App (.xcarchive / Release)
        working-directory: ./app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     build

      - name: Upload iOS Build Output
        uses: actions/upload-artifact@v4
        with:
          name: ConvertePRO-iOS-Build
          path: app/ios/App/build/Release-iphoneos/
