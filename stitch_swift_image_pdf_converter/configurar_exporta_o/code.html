<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Configurações de Exportação</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Plus+Jakarta+Sans:wght@100..900&display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error-container": "#93000a",
                    "on-error": "#ffffff",
                    "error": "#ba1a1a",
                    "background": "#f8f9fc",
                    "surface-tint": "#0061a4",
                    "inverse-on-surface": "#eff1f4",
                    "tertiary": "#3b4758",
                    "inverse-primary": "#9fcaff",
                    "surface-container-low": "#f2f3f6",
                    "tertiary-fixed-dim": "#bbc7db",
                    "primary": "#00497d",
                    "on-secondary-fixed": "#191b22",
                    "on-secondary-container": "#62646d",
                    "on-background": "#191c1e",
                    "tertiary-container": "#535f70",
                    "on-tertiary-fixed": "#101c2b",
                    "outline": "#717782",
                    "on-secondary-fixed-variant": "#44474f",
                    "surface-bright": "#f8f9fc",
                    "primary-container": "#0061a4",
                    "inverse-surface": "#2e3133",
                    "surface-dim": "#d9dadd",
                    "secondary-container": "#e1e2ec",
                    "secondary": "#5c5e66",
                    "tertiary-fixed": "#d7e3f8",
                    "on-tertiary": "#ffffff",
                    "on-secondary": "#ffffff",
                    "on-primary": "#ffffff",
                    "primary-fixed-dim": "#9fcaff",
                    "surface-container": "#edeef1",
                    "surface-container-highest": "#e1e2e5",
                    "on-primary-fixed-variant": "#00497d",
                    "secondary-fixed": "#e1e2ec",
                    "on-surface-variant": "#414750",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-high": "#e7e8eb",
                    "on-primary-container": "#c0dbff",
                    "on-surface": "#191c1e",
                    "surface": "#f8f9fc",
                    "outline-variant": "#c1c7d2",
                    "surface-variant": "#e1e2e5",
                    "on-primary-fixed": "#001d36",
                    "on-tertiary-fixed-variant": "#3c4858",
                    "on-tertiary-container": "#cdd9ed",
                    "secondary-fixed-dim": "#c5c6d0",
                    "primary-fixed": "#d1e4ff",
                    "error-container": "#ffdad6"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "base": "8px",
                    "gutter": "12px",
                    "stack-lg": "24px",
                    "margin-tablet": "24px",
                    "margin-mobile": "16px",
                    "stack-sm": "4px",
                    "stack-md": "16px"
            },
            "fontFamily": {
                    "label-lg": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-md-mobile": ["Plus Jakarta Sans"],
                    "display-lg": ["Plus Jakarta Sans"],
                    "headline-sm": ["Plus Jakarta Sans"],
                    "label-sm": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-md": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-md-mobile": ["22px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]

          },
        },
      }
    </script>
<style>
        /* Custom lightweight animations */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.4s cubic-bezier(0.2, 0, 0, 1) forwards;
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex justify-center">
<!-- Mobile Container (Max Width for desktop viewing) -->
<div class="w-full max-w-md flex flex-col h-screen bg-surface-container-lowest shadow-2xl overflow-hidden relative">
<!-- TopAppBar (Applying Shared Component JSON logic for styles, adapting content to specific task) -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full z-50 bg-surface-container-lowest border-b border-surface-variant shrink-0 sticky top-0">
<button aria-label="Voltar" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">Configurações de Exportação</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-margin-mobile py-stack-lg flex flex-col gap-stack-lg">
<!-- File Name Input Section -->
<section class="animate-slide-up opacity-0 flex flex-col gap-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1" for="filename">Nome do Arquivo</label>
<div class="relative group">
<input class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all duration-200" id="filename" placeholder="Digite o nome do arquivo" type="text" value="documento_convertido"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">edit</span>
</div>
<p class="font-body-md text-body-md text-outline mt-1 ml-1">A extensão será adicionada automaticamente.</p>
</section>
<!-- Destination Folder Section (Tonal Container) -->
<section class="animate-slide-up delay-100 opacity-0 flex flex-col gap-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1">Pasta de Destino</label>
<div class="flex items-center justify-between bg-surface-container-low rounded-xl p-4 border border-outline-variant hover:border-outline transition-colors group">
<div class="flex items-center gap-gutter overflow-hidden">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center shrink-0 text-on-secondary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">folder</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-lg text-label-lg text-on-surface truncate">Armazenamento Local</span>
<span class="font-body-md text-body-md text-on-surface-variant truncate">/Documentos/PDFs</span>
</div>
</div>
<button class="font-label-lg text-label-lg text-primary hover:text-primary-container active:scale-95 transition-all px-3 py-2 rounded-md hover:bg-surface-container-high shrink-0">
                        Alterar
                    </button>
</div>
</section>
<!-- Quality Toggle (Segmented Control) -->
<section class="animate-slide-up delay-200 opacity-0 flex flex-col gap-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1">Qualidade de Exportação</label>
<div class="flex bg-surface-container-low p-1 rounded-xl border border-outline-variant/50">
<button class="flex-1 py-2.5 rounded-lg bg-surface-container-lowest shadow-sm font-label-lg text-label-lg text-on-surface border border-outline-variant/30 flex items-center justify-center gap-2 transition-all">
<span class="material-symbols-outlined text-[18px]">high_quality</span>
                        Alta
                    </button>
<button class="flex-1 py-2.5 rounded-lg font-label-lg text-label-lg text-on-surface-variant hover:bg-surface-container-highest flex items-center justify-center gap-2 transition-all">
<span class="material-symbols-outlined text-[18px]">sd</span>
                        Média
                    </button>
<button class="flex-1 py-2.5 rounded-lg font-label-lg text-label-lg text-on-surface-variant hover:bg-surface-container-highest flex items-center justify-center gap-2 transition-all">
<span class="material-symbols-outlined text-[18px]">compress</span>
                        Baixa
                    </button>
</div>
<p class="font-body-md text-body-md text-outline mt-1 ml-1 text-center">Alta qualidade resulta em arquivos maiores.</p>
</section>
</main>
<!-- Fixed Bottom Action Area -->
<div class="animate-slide-up delay-300 opacity-0 shrink-0 p-margin-mobile bg-surface-container-lowest border-t border-surface-variant">
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-lg text-label-lg py-4 rounded-xl flex items-center justify-center gap-2 transition-all duration-200 active:scale-[0.98] shadow-md shadow-primary/20">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">generating_tokens</span>
                Converter Agora
            </button>
</div>
</div>
<!-- Inline script for micro-interactions (Segmented Control Logic) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const qualityButtons = document.querySelectorAll('section:nth-of-type(3) button');
            
            qualityButtons.forEach(button => {
                button.addEventListener('click', () => {
                    // Reset all buttons
                    qualityButtons.forEach(btn => {
                        btn.className = 'flex-1 py-2.5 rounded-lg font-label-lg text-label-lg text-on-surface-variant hover:bg-surface-container-highest flex items-center justify-center gap-2 transition-all';
                    });
                    
                    // Set active state
                    button.className = 'flex-1 py-2.5 rounded-lg bg-surface-container-lowest shadow-sm font-label-lg text-label-lg text-on-surface border border-outline-variant/30 flex items-center justify-center gap-2 transition-all';
                });
            });
        });
    </script>
</body></html>
