<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Arquivo Convertido</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "background": "#f8f9fc",
                        "surface-tint": "#0061a4",
                        "inverse-on-surface": "#eff1f4",
                        "tertiary": "#3b4758",
                        "inverse-primary": "#9fcaff",
                        "surface-container-low": "#f2f3f6",
                        "tertiary-fixed-dim": "#bbc7db",
                        "primary": "#00497d",
                        "on-secondary-fixed": "#191b22",
                        "on-secondary-container": "#62646d",
                        "on-background": "#191c1e",
                        "tertiary-container": "#535f70",
                        "on-tertiary-fixed": "#101c2b",
                        "outline": "#717782",
                        "on-secondary-fixed-variant": "#44474f",
                        "surface-bright": "#f8f9fc",
                        "primary-container": "#0061a4",
                        "inverse-surface": "#2e3133",
                        "surface-dim": "#d9dadd",
                        "secondary-container": "#e1e2ec",
                        "secondary": "#5c5e66",
                        "tertiary-fixed": "#d7e3f8",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#9fcaff",
                        "surface-container": "#edeef1",
                        "surface-container-highest": "#e1e2e5",
                        "on-primary-fixed-variant": "#00497d",
                        "secondary-fixed": "#e1e2ec",
                        "on-surface-variant": "#414750",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#e7e8eb",
                        "on-primary-container": "#c0dbff",
                        "on-surface": "#191c1e",
                        "surface": "#f8f9fc",
                        "outline-variant": "#c1c7d2",
                        "surface-variant": "#e1e2e5",
                        "on-primary-fixed": "#001d36",
                        "on-tertiary-fixed-variant": "#3c4858",
                        "on-tertiary-container": "#cdd9ed",
                        "secondary-fixed-dim": "#c5c6d0",
                        "primary-fixed": "#d1e4ff",
                        "error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "gutter": "12px",
                        "stack-lg": "24px",
                        "margin-tablet": "24px",
                        "margin-mobile": "16px",
                        "stack-sm": "4px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "label-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md-mobile": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "headline-sm": ["Plus Jakarta Sans"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md-mobile": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .success-animation {
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">
<!-- TopAppBar (Transactional - Hidden Navigation Shells below, but keeping header for title as per prompt "Top bar says 'Concluído'") -->
<header class="flex justify-between items-center px-margin-mobile md:px-margin-tablet h-16 w-full z-50 bg-surface dark:bg-background">
<div class="flex items-center gap-4">
<button class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors active:scale-95 duration-100 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<h1 class="font-headline-sm text-headline-sm text-primary text-center flex-1 pr-12">Concluído</h1>
</header>
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile md:px-margin-tablet py-stack-lg max-w-md mx-auto w-full gap-stack-lg">
<!-- Success Icon -->
<div class="flex flex-col items-center gap-stack-md success-animation">
<div class="w-24 h-24 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-[64px] text-primary icon-fill" data-icon="check_circle">check_circle</span>
</div>
<h2 class="font-headline-md-mobile text-headline-md-mobile text-on-surface text-center px-4">
                Arquivo convertido com sucesso!
            </h2>
</div>
<!-- File Preview Card -->
<div class="w-full bg-surface-container-lowest rounded-xl p-4 shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-surface-container-highest flex items-center gap-4 hover:shadow-[0_4px_12px_rgba(0,0,0,0.08)] transition-shadow">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center text-on-surface-variant shrink-0">
<span class="material-symbols-outlined icon-fill" data-icon="description">description</span>
</div>
<div class="flex-1 min-w-0">
<p class="font-label-lg text-label-lg text-on-surface truncate">documento_convertido.pdf</p>
<p class="font-body-md text-body-md text-on-surface-variant">1.2 MB • PDF</p>
</div>
</div>
<!-- Actions -->
<div class="w-full flex flex-col sm:flex-row gap-4 mt-4">
<button class="flex-1 h-12 rounded-xl border border-outline text-primary font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-surface-container-lowest transition-colors active:scale-95">
<span class="material-symbols-outlined text-lg" data-icon="open_in_new">open_in_new</span>
                Abrir Arquivo
            </button>
<button class="flex-1 h-12 rounded-xl bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-primary-container/90 transition-colors active:scale-95 shadow-[0_4px_12px_rgba(0,0,0,0.12)]">
<span class="material-symbols-outlined text-lg" data-icon="share">share</span>
                Compartilhar
            </button>
</div>
<button class="mt-4 text-primary font-label-sm text-label-sm hover:underline py-2 px-4 rounded-full hover:bg-surface-container-low transition-colors">
            Converter outro arquivo
        </button>
</main>
</body></html>
